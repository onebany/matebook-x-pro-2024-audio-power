# Huawei MateBook X Pro 2024 — Conexant CX11970, 2 tweeters + 4 woofers
# NHLT from the topology; the speaker PCM in 4 channels like Windows: FL FR = woofers (DAC 0x23),
# RL RR = tweeters (DAC 0x22). Built by topology/build.sh. Back to the stock 2-channel topology, both together
# (either alone leaves Dummy Output): sof-hda-generic-ace1-4ch.tplg here and
# sudo rm /usr/share/alsa/ucm2/conf.d/sof-hda-dsp/HUAWEI-VGHH_XX-M1010-VGHH_XX_PCB.conf, then
# sudo update-initramfs -u and reboot.
options snd_sof_intel_hda_common sof_use_tplg_nhlt=1
options snd_sof_pci tplg_filename=sof-hda-generic-ace1-4ch-spk4.tplg
