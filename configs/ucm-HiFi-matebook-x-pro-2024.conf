# MateBook X Pro 2024 (VGHH-XX): the stock sof-hda-dsp HiFi verb with the speaker PCM in
# 4 channels (sof-hda-generic-ace1-4ch-spk4.tplg). Installed as
# /usr/share/alsa/ucm2/Intel/sof-hda-dsp/HiFi-matebook-x-pro-2024.conf; install.sh points the
# card file at it (a copy of the stock sof-hda-dsp.conf, found by the card long name).
Include.stock.File "/Intel/sof-hda-dsp/HiFi.conf"
SectionDevice."Speaker".Value.PlaybackChannels 4
