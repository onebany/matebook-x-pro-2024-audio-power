# Huawei MateBook X Pro 2024 (Conexant CX11970, 2 tweeters + 4 woofers)
# WirePlumber 0.5 syntax.
#
# api.alsa.soft-mixer = true: PipeWire does volume in software and never touches
# the ALSA 'Speaker' / 'Bass Speaker' controls. Those are set to 100% once by
# install.sh (and stored in asound.state), so the tweeter/woofer balance no
# longer drifts with the volume slider or a WirePlumber restart.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.pci-0000_00_1f.3.*" } ]
    actions = {
      update-props = {
        device.profile             = "HiFi: Speaker: sink"
        device.profile.auto-switch = false
        api.alsa.soft-mixer        = true
      }
    }
  }
]
