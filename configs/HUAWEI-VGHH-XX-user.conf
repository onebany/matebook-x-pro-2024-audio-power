# MateBook X Pro 2024 — SOF DSP tuning override (DMI: HUAWEI / VGHH-XX)
#
# Default UCM loads highpass_100hz + speaker_default DRC, which cuts bass and
# squashes dynamics on the 6-speaker array. Use flat EQ + passthrough DRC so
# NHLT topology tuning is not masked by generic blobs.

Define.PostMixerAnalogPlaybackSpeakerIirBlob "${ConfTopDir}/blobs/sof/ipc4/eq_iir/pass.bin"
Define.PostMixerAnalogPlaybackSpeakerFirBlob "${ConfTopDir}/blobs/sof/ipc4/eq_fir/pass.bin"
Define.PostMixerAnalogPlaybackSpeakerDrcBlob "${ConfTopDir}/blobs/sof/ipc4/drc/passthrough.bin"
