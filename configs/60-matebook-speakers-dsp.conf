# Huawei MateBook X Pro 2024 speaker DSP as a PipeWire filter-chain in front of
# the speaker sink: parametric EQ -> bass enhancer -> compressor -> limiter.
#
# Same LV2 plugins and values as the former EasyEffects "MateBook Speakers"
# preset, but running inside pipewire itself: no GUI app, no session hacks,
# active on the greeter and lock screen too.
#
# Gains are linear (10^(dB/20)); dB values are in the comments.
# Plugins: lsp-plugins-lv2 (EQ, compressor, limiter), calf-plugins (bass enhancer).
context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "MateBook Speakers"
      media.name       = "MateBook Speakers"
      filter.graph = {
        nodes = [
          {
            type = lv2  name = eq
            plugin = "http://lsp-plug.in/plugins/lv2/para_equalizer_x16_stereo"
            control = {
              mode = 0                                   # IIR
              # ft: 1 Bell, 3 Hi-shelf, 5 Lo-shelf   fm 0: RLC (BT)   s 3: slope x4
              ft_0  = 5  fm_0  = 0  s_0  = 3  f_0  = 70     g_0  = 2.51189  q_0  = 0.7   # +8.0 dB
              ft_1  = 1  fm_1  = 0  s_1  = 3  f_1  = 120    g_1  = 1.67880  q_1  = 0.9   # +4.5 dB
              ft_2  = 1  fm_2  = 0  s_2  = 3  f_2  = 250    g_2  = 1.33352  q_2  = 1.0   # +2.5 dB
              ft_3  = 1  fm_3  = 0  s_3  = 3  f_3  = 500    g_3  = 1.12202  q_3  = 1.0   # +1.0 dB
              ft_4  = 1  fm_4  = 0  s_4  = 3  f_4  = 800    g_4  = 0.84140  q_4  = 1.1   # -1.5 dB
              ft_5  = 1  fm_5  = 0  s_5  = 3  f_5  = 1400   g_5  = 0.94406  q_5  = 1.0   # -0.5 dB
              ft_6  = 1  fm_6  = 0  s_6  = 3  f_6  = 3200   g_6  = 1.05925  q_6  = 1.0   # +0.5 dB
              ft_7  = 1  fm_7  = 0  s_7  = 3  f_7  = 7000   g_7  = 1.49624  q_7  = 1.0   # +3.5 dB
              ft_8  = 3  fm_8  = 0  s_8  = 3  f_8  = 9000   g_8  = 1.88365  q_8  = 0.7   # +5.5 dB
              ft_9  = 1  fm_9  = 0  s_9  = 3  f_9  = 12000  g_9  = 1.41254  q_9  = 0.9   # +3.0 dB
              ft_10 = 1  fm_10 = 0  s_10 = 3  f_10 = 16000  g_10 = 1.33352  q_10 = 0.8   # +2.5 dB
            }
          }
          {
            type = lv2  name = bass
            plugin = "http://calf.sourceforge.net/plugins/BassEnhancer"
            control = {
              amount = 3.98107      # +12 dB
              drive  = 10           # harmonics (plugin max; preset asked for 16)
              blend  = 0
              freq   = 100          # scope, Hz
              floor_active = 1
              floor  = 10           # Hz (plugin minimum; preset asked for 3)
              level_in = 1  level_out = 1  listen = 0  bypass = 0
            }
          }
          {
            type = lv2  name = comp
            plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
            control = {
              cm  = 0               # downward
              scm = 1  scs = 0  scr = 10  sla = 0  scp = 1     # RMS sidechain, middle
              al  = 0.10000         # threshold -20 dB
              at  = 25  rt = 140    # ms
              rrl = 0.00010         # release threshold -80 dB
              cr  = 1.6
              kn  = 0.12589         # knee -18 dB
              mk  = 1.18850         # makeup +1.5 dB
              cdr = 0  cwt = 1      # dry/wet
              g_in = 1  g_out = 1
            }
          }
          {
            type = lv2  name = lim
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              mode = 0              # Herm Thin
              th   = 0.89125        # ceiling -1 dB
              knee = 1
              lk = 5  at = 5  rt = 50
              ovs = 0  dith = 0  alr = 0  boost = 1  slink = 100
              g_in = 1  g_out = 1  scp = 1
            }
          }
        ]
        links = [
          { output = "eq:out_l"   input = "bass:in_l" }
          { output = "eq:out_r"   input = "bass:in_r" }
          { output = "bass:out_l" input = "comp:in_l" }
          { output = "bass:out_r" input = "comp:in_r" }
          { output = "comp:out_l" input = "lim:in_l" }
          { output = "comp:out_r" input = "lim:in_r" }
        ]
        inputs  = [ "eq:in_l"  "eq:in_r" ]
        outputs = [ "lim:out_l" "lim:out_r" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      # WirePlumber "smart filter": inserted transparently in front of the
      # speaker sink. Apps and GNOME keep using the normal "Speaker" output;
      # nothing extra to select, the DSP just sits in the path.
      capture.props = {
        node.name   = "matebook_speakers"
        media.class = Audio/Sink
        filter.smart        = true
        filter.smart.name   = "matebook-speakers-dsp"
        filter.smart.target = { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink" }
      }
      playback.props = {
        node.name         = "matebook_speakers.out"
        node.passive      = true
        stream.dont-remix = true
      }
    }
  }
]
