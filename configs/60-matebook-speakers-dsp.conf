# Huawei MateBook X Pro 2024 speakers as Windows plays them with "Audio enhancements" on: Huawei Histen (EQ,
# 3-band compressor, limiter), then the SmartPA crossover (woofers FL FR below 3.2 kHz, tweeters RL RR above 3 kHz).
# The graph is the approximation a Windows agent fitted to WASAPI loopback captures (set SMART_ONE, which Windows
# uses below 53 % volume); the test file through it lands within 0.3-2 dB per third octave of Windows' own loopback.
# Then a power guard per speaker group: 250 ms RMS at most what a full-scale sine gets in the amps' INBOX mode,
# because amps.py runs them in Windows' ALGO mode (+8.8 dB woofers, +8.2 dB tweeters) and Huawei's SmartPA speaker
# protection does not run here. Music stays under the guard; ./dsp-check.py checks both.
# Needs LADSPA sc4 and fastLookaheadLimiter (swh-plugins), LSP compressor_stereo (lsp-plugins-lv2).
#
# WirePlumber creates the "Speaker" output with this graph inside its audioconvert (the ALSA node's property
# audioconvert.filter-graph.0), so GNOME lists one output and its slider is the volume. A separate filter-chain
# sink aimed at Speaker was destroyed by WirePlumber whenever Speaker was briefly gone (card coming up, profile).
# Not node.filter-graph.rules: that sets the graph as a runtime Props param, which PipeWire 1.6 cuts at 4 KB.
# Speaker is FL FR RL RR: the graph takes FL FR and ignores what upmixing puts on RL RR. Its capture.volumes
# make the Speaker slider act after the dynamics, as the Windows volume does.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink" }
    ]
