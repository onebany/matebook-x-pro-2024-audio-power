# Huawei MateBook X Pro 2024 speaker DSP as a PipeWire filter-chain sink
# "MateBook Speakers" (the default output) feeding the speaker sink:
#   parametric EQ -> bass enhancer -> high-pass + stereo width (M/S) -> 3-band compressor -> limiter.
#
# Based on the former EasyEffects "MateBook Speakers" preset, running inside
# pipewire itself: no GUI app, no session hacks, active on the greeter and lock
# screen too. Every change to the preset is measured through these same plugins
# with ./dsp-check.py (silent; see README).
#
# Gains are linear (10^(dB/20)); dB values are in the comments.
# Plugins: lsp-plugins-lv2 (EQ, multiband compressor, limiter), calf-plugins (bass enhancer).
context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "MateBook Speakers"
      media.name       = "MateBook Speakers"
      filter.graph = {
        nodes = [
          {
            type = lv2  name = eq
            plugin = "http://lsp-plug.in/plugins/lv2/para_equalizer_x16_stereo"
            control = {
              mode = 0                                   # IIR
              # ft: 1 Bell, 3 Hi-shelf, 5 Lo-shelf   fm 0: RLC (BT)   s 3: slope x4
              # Band 0 (the preset's +8 dB x4 shelf at 70 Hz) is off: everything it
              # lifted sits below the high-pass and only drove the limiter.
              # 120 Hz +3 dB, not +4.5: kick peaks there hit the limiter (Windows
              # measures this region 7 dB under the mids, Notebookcheck 2024).
              # Body: measured in the room with the built-in mics (mic-sweep.py),
              # 200-630 Hz sat 8-13 dB further under 1-2.5 kHz than on Windows and
              # 1.25-1.6 kHz 3 dB over it. 300 Hz +9 dB wide, 500 Hz +5 dB and
              # 1400 Hz -4 dB bring it within ~2 dB at medium volume; at full
              # volume the 3-band compressor takes part of it back.
              ft_1  = 1  fm_1  = 0  s_1  = 3  f_1  = 120    g_1  = 1.41254  q_1  = 0.9   # +3.0 dB
              ft_2  = 1  fm_2  = 0  s_2  = 3  f_2  = 300    g_2  = 2.81838  q_2  = 0.7   # +9.0 dB
              ft_3  = 1  fm_3  = 0  s_3  = 3  f_3  = 500    g_3  = 1.77828  q_3  = 1.0   # +5.0 dB
              ft_4  = 1  fm_4  = 0  s_4  = 3  f_4  = 800    g_4  = 0.84140  q_4  = 1.1   # -1.5 dB
              ft_5  = 1  fm_5  = 0  s_5  = 3  f_5  = 1400   g_5  = 0.63096  q_5  = 1.0   # -4.0 dB
              ft_6  = 1  fm_6  = 0  s_6  = 3  f_6  = 3200   g_6  = 1.05925  q_6  = 1.0   # +0.5 dB
              ft_7  = 1  fm_7  = 0  s_7  = 3  f_7  = 7000   g_7  = 1.49624  q_7  = 1.0   # +3.5 dB
              ft_8  = 3  fm_8  = 0  s_8  = 3  f_8  = 9000   g_8  = 1.88365  q_8  = 0.7   # +5.5 dB
              ft_9  = 1  fm_9  = 0  s_9  = 3  f_9  = 12000  g_9  = 1.41254  q_9  = 0.9   # +3.0 dB
              ft_10 = 1  fm_10 = 0  s_10 = 3  f_10 = 16000  g_10 = 1.33352  q_10 = 0.8   # +2.5 dB
            }
          }
          {
            type = lv2  name = bass
            plugin = "http://calf.sourceforge.net/plugins/BassEnhancer"
            control = {
              amount = 3.98107      # +12 dB
              drive  = 2            # harmonics. 10 (max) saturated so hard that they stopped
                                    # following the bass: loud bass came out 6 dB weaker
                                    # than quiet bass
              blend  = 0
              freq   = 100          # scope, Hz
              floor_active = 1
              floor  = 10           # Hz (plugin minimum; preset asked for 3)
              level_in = 1  level_out = 1  listen = 0  bypass = 0
            }
          }
          {
            # High-pass and stereo width in one mid/side equalizer.
            # Mid: the speakers cannot reproduce the sub-bass the enhancer works
            # from, yet the limiter reacted to it and pulled the audible band
            # down. Cut it after the enhancer, which has already turned it into
            # audible harmonics. ft 2: Hi-pass, s 2: x3 (36 dB/oct; x2 left 30%
            # of dsp-check's output energy below 90 Hz, x3 17%). q 0.707: the default
            # q 0 is overdamped and would still cut 4 dB at 200 Hz.
            # Mid 1: 150 Hz +6 dB, here after the enhancer so its input (and so its
            # harmonics) stay as they were.
            # Side: +6 dB for width, high-passed at 200 Hz so the bass is mono
            # and all four woofers push together.
            type = lv2  name = hpf
            plugin = "http://lsp-plug.in/plugins/lv2/para_equalizer_x8_ms"
            control = {
              mode = 0  gain_s = 1.99526                                   # side +6 dB
              ftm_0 = 2  fmm_0 = 0  sm_0 = 2  fm_0 = 100  qm_0 = 0.707   # mid
              ftm_1 = 1  fmm_1 = 0  sm_1 = 0  fm_1 = 150  gm_1 = 1.99526  qm_1 = 0.8   # mid +6 dB
              fts_0 = 2  fms_0 = 0  ss_0 = 1  fs_0 = 200  qs_0 = 0.707   # side
            }
          }
          {
            # Three bands split at 250 Hz and 1 kHz, like the Windows driver's
            # Histen DRC (splits 230/1400/6000/10000 Hz in histen90_config), each
            # with its own compressor: bass and body no longer pull the presence
            # down (the single-band compressor dipped a steady 2.5 kHz tone 2 dB on
            # every kick). Bass band: ratio 4, slow 80 ms attack, so the kick passes
            # and the sustained bass is held. At full volume the woofers get less
            # 80-250 Hz than with the earlier tunings (dsp-check's loud bass:
            # -12.4 dBFS vs -11.6 and -9.1). mode 1: Modern (IIR crossovers),
            # envb 0: flat sidechain; bands 3+ off.
            type = lv2  name = comp
            plugin = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
            control = {
              mode = 1  envb = 0  ssplit = 0  g_in = 1  g_out = 1
              cbe_1 = 1  sf_1 = 250  cbe_2 = 1  sf_2 = 1000
              cbe_3 = 0  cbe_4 = 0  cbe_5 = 0  cbe_6 = 0  cbe_7 = 0
              # per band: RMS sidechain on the middle, downward
              scm_0 = 1  scs_0 = 0  scr_0 = 10  sla_0 = 0  scp_0 = 1  cm_0 = 0  ce_0 = 1
              scm_1 = 1  scs_1 = 0  scr_1 = 10  sla_1 = 0  scp_1 = 1  cm_1 = 0  ce_1 = 1
              scm_2 = 1  scs_2 = 0  scr_2 = 10  sla_2 = 0  scp_2 = 1  cm_2 = 0  ce_2 = 1
              # threshold, attack/release ms, ratio, knee -18 dB, makeup
              al_0 = 0.07943  at_0 = 80  rt_0 = 140  cr_0 = 4    kn_0 = 0.12589  mk_0 = 1.58489   # bass -22 dB, +4 dB
              al_1 = 0.10000  at_1 = 40  rt_1 = 140  cr_1 = 2    kn_1 = 0.12589  mk_1 = 1.77828   # body -20 dB, +5 dB
              al_2 = 0.10000  at_2 = 40  rt_2 = 140  cr_2 = 1.6  kn_2 = 0.12589  mk_2 = 1.99526   # presence -20 dB, +6 dB
            }
          }
          {
            type = lv2  name = lim
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              mode = 0              # Herm Thin
              th   = 0.89125        # ceiling -1 dB
              knee = 1
              # Release is capped at 20 ms and at 2x lookahead: lk 5 / rt 50 meant
              # 10 ms, short enough to cut every cycle of a 50 Hz bass note.
              lk = 10  at = 5  rt = 20
              # alr 0: the slow ALR stage (50 ms release) pumps the mix 8 dB on kicks.
              ovs = 0  dith = 0  alr = 0  boost = 1  slink = 100
              g_in = 1  g_out = 1  scp = 1
            }
          }
        ]
        links = [
          { output = "eq:out_l"   input = "bass:in_l" }
          { output = "eq:out_r"   input = "bass:in_r" }
          { output = "bass:out_l" input = "hpf:in_l" }
          { output = "bass:out_r" input = "hpf:in_r" }
          { output = "hpf:out_l"  input = "comp:in_l" }
          { output = "hpf:out_r"  input = "comp:in_r" }
          { output = "comp:out_l" input = "lim:in_l" }
          { output = "comp:out_r" input = "lim:in_r" }
        ]
        inputs  = [ "eq:in_l"  "eq:in_r" ]
        outputs = [ "lim:out_l" "lim:out_r" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      # A normal virtual sink and the default output: its volume slider scales
      # the input, before the DSP, so at low and medium volume the compressor
      # and limiter stay idle. (As a WirePlumber smart filter the slider stayed
      # on the Speaker sink, after the limiter, and every volume was squeezed
      # alike.) GNOME lists the raw "Speaker" next to it, without the DSP; it
      # stays at 100%.
      capture.props = {
        node.name        = "matebook_speakers"
        media.class      = Audio/Sink
        # default on a fresh install: above the raw Speaker sink (1000)
        priority.session = 1100
      }
      playback.props = {
        node.name          = "matebook_speakers.out"
        node.passive       = true
        stream.dont-remix  = true
        # always the speakers, never whatever the default output is
        target.object      = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink"
        node.dont-fallback = true
      }
    }
  }
]
